<script>
    const socket = new WebSocket('https://localhost:3000');
    socket.onopen = () => {
        console.log('Connected to the server');
        socket.send('Hi');
    }

    socket.onmessage = (event) => {
        console.log(`Message From Server: ${event.data}`);
    }
</script>
